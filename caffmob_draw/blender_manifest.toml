schema_version = "1.0.0"

id = "caffmob_draw"
version = "1.22.1"
name = "CAFFMob Draw"
tagline = "Parametric cabinetry and interior design CAD tools for Blender"
maintainer = "TheLeoInfo"
type = "add-on"

blender_version_min = "5.2.0"

license = [
    "SPDX:GPL-3.0-or-later",
]
# Metadata for online extensions directory, categorizing the add-on
tags = ["3D View", "Add Mesh", "Modeling", "Scene"]
location = "View3D > Sidebar > CAFFMob Draw"
description = "Functional parametric interior design and cabinetry tools (inspired by Promob), including wall-building, floors, snap rules, and nested cut-list optimization."

platforms = ["linux-x64", "linux-arm64", "windows-x64", "macos-x64", "macos-arm64"]

wheels = [
    "./wheels/defusedxml-0.7.1-py2.py3-none-any.whl",
    "./wheels/mapbox_earcut-2.1.0-cp313-cp313-macosx_10_13_x86_64.whl",
    "./wheels/mapbox_earcut-2.1.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/mapbox_earcut-2.1.0-cp313-cp313-manylinux_2_26_aarch64.manylinux_2_28_aarch64.whl",
    "./wheels/mapbox_earcut-2.1.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/mapbox_earcut-2.1.0-cp313-cp313-win_amd64.whl",
    "./wheels/openskp-1.3.0-py3-none-any.whl",
    "./wheels/shapely-2.2.0-cp313-cp313-macosx_10_13_x86_64.whl",
    "./wheels/shapely-2.2.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/shapely-2.2.0-cp313-cp313-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl",
    "./wheels/shapely-2.2.0-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/shapely-2.2.0-cp313-cp313-win_amd64.whl",
]

[build]
paths_exclude_pattern = [".impeccable/", "__pycache__/", "catalog/"]

[permissions]
files = "Save projects and export cut plans, PDFs and layouts"
network = "Sync environments, models and textures with CAFF MOBI"
